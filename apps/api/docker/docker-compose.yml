services:

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: bookito_web

    volumes:
      - ../:/app

    ports:
      - "8000:8000"

    env_file:
      - ../.env

    depends_on:
      - db
      - redis

  db:
    image: postgres:18

    container_name: bookito_db

    # environment:
    #   POSTGRES_DB: Bookito_db
    #   POSTGRES_USER: Bookito_user
    #   POSTGRES_PASSWORD: Bookito2020

    env_file:
      - ../.env

    volumes:
      - postgres_data:/var/lib/postgresql

    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: bookito_redis

    command: ["redis-server", "--appendonly", "yes"]

    volumes:
      - redis_data:/data


volumes:
  postgres_data:
  redis_data: